<nav class="navbar">

  <div class="logo">
    Job<span>Portal</span>
  </div>

  <div class="nav-links">
    <a routerLink="/home">Home</a>
    <a routerLink="/jobs">Jobs</a>
    <a routerLink="/contact">Contact</a>
  </div>

</nav>


<section class="apply-page">

  <div class="apply-card">

    <h1>Apply Now</h1>

    <p class="subtitle">
      Fill in your details to apply for this job.
    </p>


    <form (ngSubmit)="submitApplication()">

      <div class="form-group">

        <label>Full Name *</label>

        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your full name"
          required>

      </div>


      <div class="form-group">

        <label>Email *</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required>

      </div>


      <div class="form-group">

        <label>Phone Number *</label>

        <input
          type="tel"
          name="phone"
          [(ngModel)]="phone"
          placeholder="Enter your phone number"
          required>

      </div>


      <div class="form-group">

        <label>Highest Qualification *</label>

        <select
          name="qualification"
          [(ngModel)]="qualification"
          required>

          <option value="">
            Select Qualification
          </option>

          <option value="B.Tech">
            B.Tech
          </option>

          <option value="B.E">
            B.E
          </option>

          <option value="BCA">
            BCA
          </option>

          <option value="MCA">
            MCA
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>Experience</label>

        <select
          name="experience"
          [(ngModel)]="experience">

          <option value="">
            Select Experience
          </option>

          <option value="Fresher">
            Fresher
          </option>

          <option value="0-1 Years">
            0-1 Years
          </option>

          <option value="1-2 Years">
            1-2 Years
          </option>

          <option value="2+ Years">
            2+ Years
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>Resume Link</label>

        <input
          type="text"
          name="resume"
          [(ngModel)]="resume"
          placeholder="Paste your resume link">

      </div>


      <button type="submit">
        Submit Application
      </button>

    </form>


    <a routerLink="/jobs" class="back">
      ← Back to Jobs
    </a>

  </div>

</section>
